services:
  audit-svc:
    build:
      context: ..
      dockerfile: deploy/docker/audit-svc.Dockerfile
    # dev-only: loopback-bound host port mapping. Drop this in production —
    # only the orchestrator (same "netsec" network) should reach this service.
    ports:
      - "127.0.0.1:8081:8081"
    networks: [netsec]

  scan-svc:
    build:
      context: ..
      dockerfile: deploy/docker/scan-svc.Dockerfile
    # dev-only: loopback-bound host port mapping. Drop this in production —
    # only the orchestrator (same "netsec" network) should reach this service.
    ports:
      - "127.0.0.1:8082:8082"
    networks: [netsec]

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/docker/orchestrator.Dockerfile
    depends_on: [audit-svc, scan-svc]
    # dev-only: loopback-bound. The orchestrator has no authentication yet —
    # put it behind a reverse proxy with auth before exposing it on a LAN.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - orchestrator-data:/data
      - findings-log:/var/log/netsec-orchestrator
    networks: [netsec]

networks:
  netsec:
    driver: bridge

volumes:
  orchestrator-data:
  findings-log:
