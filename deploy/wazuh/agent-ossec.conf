<!--
  deploy/wazuh/agent-ossec.conf — full ossec.conf for the wazuh-agent
  container in deploy/docker-compose.yml (service "wazuh-agent", profile
  "wazuh"). Bind-mounted read-only to /wazuh-config-mount/etc/ossec.conf —
  the official wazuh/wazuh-agent image's entrypoint copies this into
  /var/ossec/etc/ossec.conf on startup and substitutes the CHANGE_* tokens
  below from the WAZUH_MANAGER_SERVER / WAZUH_MANAGER_PORT /
  WAZUH_REGISTRATION_SERVER / WAZUH_REGISTRATION_PORT / WAZUH_AGENT_NAME /
  WAZUH_AGENT_GROUP env vars set on that service (see set_manager_conn() in
  the image's entrypoint script; confirmed against wazuh/wazuh-docker@v4.14.7).

  Host-EDR features (rootcheck/syscheck/sca/wodles/active-response) are
  disabled on purpose: this agent's only job is forwarding the
  orchestrator's findings.jsonl, not monitoring the container's own
  filesystem — enable them if you also want FIM/rootkit checks on this
  container itself.
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Tails the orchestrator's findings — see ossec-localfile-snippet.xml
       for the same block on its own, and decoder.xml/rules.xml for how the
       manager turns these lines into alerts. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/netsec-orchestrator/findings.jsonl</location>
    <label key="program_name">netsec-orchestrator</label>
  </localfile>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
